[package]
categories = ["api-bindings", "encoding", "multimedia::images"]
description = "Safe Rust wrapper for JPEG XL reference implementation"
edition.workspace = true
keywords = ["jpeg-xl", "jxl"]
license = "GPL-3.0-or-later"
name = "jpegxl-rs"
readme = "README.md"
repository.workspace = true
version = "0.17.0+libjxl-0.13.0"
rust-version.workspace = true

[lints.rust]
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }

[lints.clippy]
pedantic = "warn"
undocumented_unsafe_blocks = "warn"

[features]
default = ["image"]
image = ["dep:image"]
vendored = ["jpegxl-sys/vendored"]
docs = ["jpegxl-sys/docs"]
bench = []

[dependencies]
image = { version = "0.25", optional = true, default-features = false }
thiserror = "2.0.18"
half = "2.7.1"
byteorder = "1.5.0"
bon = "3.9.1"

[dependencies.jpegxl-sys]
version = "0.14.0"
path = "../jpegxl-sys"
default-features = false

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
lcms2 = "6.1.1"
pretty_assertions = "1.4.1"
testresult = "0.4.1"

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
criterion = "0.7.0"

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
features = ["docs"]

[lib]
bench = false
path = "src/lib.rs"

[[bench]]
harness = false
name = "decode"
required-features = ["bench"]

[[bench]]
harness = false
name = "encode"
required-features = ["bench"]
