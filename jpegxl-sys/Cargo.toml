[package]
categories = ["external-ffi-bindings", "encoding", "multimedia::images"]
description = "Rust wrapper for JPEG XL reference implementation"
edition.workspace = true
keywords = ["jpeg-xl", "jxl"]
license = "GPL-3.0-or-later"
links = "jxl"
name = "jpegxl-sys"
readme = "README.md"
repository.workspace = true
version = "0.14.0+libjxl-0.13.0"
rust-version.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }

[lints.clippy]
pedantic = "warn"
module_name_repetitions = "allow"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[package.metadata.docs.rs]
features = ["docs"]

[build-dependencies]
pkg-config = "0.3.33"

[build-dependencies.jpegxl-src]
version = "0.13.0"
path = "../jpegxl-src"
optional = true

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
pretty_assertions = "1.4.1"

[features]
default = []
vendored = ["dep:jpegxl-src"]
docs = []
system-extras = []
